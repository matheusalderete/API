<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard do Clima</title>
    <link rel="stylesheet" href="style.css" />
</head>

<body>
    <div class="container">
        <h1>Dashboard do Clima</h1>
        <input type="text" id="input-cidade" placeholder="Digite uma cidade" />
        <button id="btn-buscar">Buscar</button>
        <div class="card">
            <h2 id="cidade">-</h2>
            <img id="icone" src="" alt="Clima" />
            <p><strong>Temperatura:</strong> <span id="temperatura">-</span></p>
            <p><strong>Clima:</strong> <span id="clima">-</span></p>
            <p><strong>Umidade:</strong> <span id="umidade">-</span></p>
        </div>
    </div>
    <script src="script.js"></script>
</body>

</html>
